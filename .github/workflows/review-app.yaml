name: Deploy/Review-App

on:
  pull_request_target:
    branches:
      - labs/review-apps

jobs:
  call-deploy:
    permissions:
      contents: 'read'
      id-token: 'write'
    uses: ./.github/workflows/deploy.yaml
    with:
      profile: qa
      namespace: pr-${{ github.event.number }}
      runs-on: ubuntu-latest
      environment: qa
