name: Deploy-Staging

on:
  push:
    branches:
      - labs/review-apps
    tags:
      - 'staging-*'

jobs:
  call-deploy:
    permissions:
      contents: 'read'
      id-token: 'write'
    uses: ./.github/workflows/deploy.yaml
    with:
      profile: prod
      namespace: staging
      runs-on: arc-runner-set
      environment: staging
